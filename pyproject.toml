[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asas"
version = "2.0.0"
description = "ASAS: auditable agentic surveillance - investigation, challenge, discovery and governed evolution of detection logic"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42"]

[project.optional-dependencies]
data = ["pyarrow>=14", "openpyxl>=3.1"]  # Parquet and Excel extracts (CSV/JSONL need nothing)
oidc = ["pyjwt[crypto]>=2.8"]            # security.mode = "oidc"
dev = [
  "pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.11", "mypy>=1.10",
  "pyarrow>=14", "openpyxl>=3.1", "pyjwt[crypto]>=2.8",
]

[project.scripts]
asas = "asas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asas = ["api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["asas"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "openpyxl", "openpyxl.*", "pgserver", "pgserver.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
