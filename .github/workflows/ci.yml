name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format, lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: asas-ci
          POSTGRES_DB: asas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ASAS_TEST_DATABASE_URL: postgresql://postgres:asas-ci@localhost:5432/asas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install
        run: |
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Quality gate (ruff format, ruff, mypy --strict, pytest incl. PostgreSQL)
        run: python scripts/check.py
      - name: Production readiness report (informational)
        run: python -m asas doctor || true

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit
      - name: Known vulnerabilities in the pinned production dependencies
        run: pip-audit --strict --require-hashes -r requirements/prod.lock

  image:
    name: container image
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t asas:ci .
      - name: Smoke test (CLI, config and doctor inside the image)
        run: |
          docker run --rm asas:ci --help
          docker run --rm asas:ci doctor
          docker run --rm -e ASAS_DATABASE_URL=/tmp/smoke.db --entrypoint sh asas:ci -c \
            "asas generate --out /tmp/d --days 30 && asas ingest --data /tmp/d && asas pipeline && asas verify-audit"
