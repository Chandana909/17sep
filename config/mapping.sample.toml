# Source mapping: real column names -> ASAS contract fields (specs/field-contract.md).
# To integrate real data, copy this file, change ONLY the left-hand column names, file/table
# names and value tables, then run:  python -m asas check-mapping --mapping <file> --data <dir>
# Rules: every column in a source must be mapped or listed in `ignore`, or the run fails loudly.
version = "mapping-sample-1"   # bump whenever you change anything below

# SQL-only options (ignored for CSV). paramstyle follows your DB-API driver.
[sql]
paramstyle = "qmark"      # qmark | named | format | pyformat | numeric
as_of_type = "datetime"   # datetime | naive_utc | iso  (how as_of is bound in WHERE)
quote = '"'               # identifier quote character (use "`" for MySQL)

# ---------------------------------------------------------------- alerts (required)
[alerts]
source = "scp_alerts.csv"            # CSV file name, or table/view name for SQL
naive_timestamp_offset = "+00:00"    # timestamps without a zone are read as this offset
# timestamp_format = "%d/%m/%Y %H:%M:%S"   # optional; default is ISO-8601
# transform = "my_pkg.hooks:fix_alert_row" # optional pure function(dict) -> dict
ignore = ["DESK", "REGION"]          # present in the source, deliberately unused

[alerts.columns]                     # SOURCE COLUMN = "CONTRACT FIELD"
ALERT_ID = "ALERT_ID"
ALERT_TYPE_ID = "ALERT_TYPE"
ALERT_DATE = "ALERT_TIME"
CREATED_AT = "RECORD_TIME"           # system/record time used for point-in-time
TRADE_ID = "TRADE_ID"
INSTRUMENT_IDENTIFIER = "INSTRUMENT_ID"
BOOK = "BOOK_ID"
REASON_COMMENT = "EXPLANATION_TEXT"  # untrusted free text
REASON_STD_COMMENTS = "REASON_STD_COMMENTS"  # quarantined (workflow)
RULE_FLAG = "RULE_FLAG"                      # quarantined (workflow)
TRADER_REQUESTOR = "TRADER_REQUESTOR"        # quarantined (person)
SUPERVISOR_GRP = "SUPERVISOR_GRP"            # quarantined (person)

[alerts.values.ALERT_TYPE]           # source value = contract value (keys of config categories)
PX01 = "PRICE_OFF_MARKET"
CX01 = "CANCEL_AMEND_PATTERN"
LT01 = "LATE_TRADE"

# ---------------------------------------------------------------- trade events (required)
[trade_events]
source = "trade_versions.csv"
naive_timestamp_offset = "+00:00"

[trade_events.columns]
TRADE_ID = "TRADE_ID"
EVENT_SUB_TYPE_ID = "EVENT_TYPE"
TRADE_DATE_TIME = "EVENT_TIME"
CREATED_AT = "RECORD_TIME"
INSTRUMENT_IDENTIFIER = "INSTRUMENT_ID"
BOOK = "BOOK_ID"
PRICE = "PRICE"
QUANTITY = "QUANTITY"
BUY_OR_SELL = "SIDE"
ORIGINAL_TRADE_ID = "ORIGINAL_TRADE_ID"

[trade_events.values.EVENT_TYPE]
NEW = "NEW"
AMD = "AMEND"
CXL = "CANCEL"

[trade_events.values.SIDE]
B = "BUY"
S = "SELL"

# ---------------------------------------------------------------- RFI events (optional)
# Omit this section if not integrated yet; config `data.rfi_source_required` decides whether
# that blocks bulk review (default: it does).
[rfi_events]
source = "rfi_events.csv"
naive_timestamp_offset = "+00:00"

[rfi_events.columns]
ALERT_ID = "ALERT_ID"
ACTION = "RFI_ACTION"
CREATED_AT = "RECORD_TIME"

# ---------------------------------------------------------------- past cases (optional)
[past_cases]
source = "past_cases.csv"
naive_timestamp_offset = "+00:00"

[past_cases.columns]
CASE_ID = "CASE_ID"
CATEGORY = "CATEGORY"
OUTCOME = "OUTCOME"
DECIDED_AT = "DECIDED_AT"
