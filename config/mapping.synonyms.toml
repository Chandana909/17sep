# Synonyms used by `python -m asas data draft-mapping` to propose a first mapping from real
# extract headers. Add your source systems' column names here once and every future draft
# picks them up. Matching is case-insensitive and ignores spaces, dots and dashes.
# Nothing here is trusted blindly: every guess in a draft is marked "# REVIEW".
version = "synonyms-1"

[entities]  # filename keywords per entity
trade_events = ["trade", "deal", "cal", "version", "booking", "execution"]
alerts = ["alert", "scp", "surveillance", "exception"]
rfi_events = ["rfi", "request_for_information"]
outcomes = ["outcome", "disposition", "decision", "curated", "label", "signoff"]

[fields]
TRADE_ID = ["TRADE_ID", "TRADEID", "DEAL_ID", "DEAL_NUMBER", "DEAL_NO", "TRADE_REF", "TRADE_NUMBER", "CONTRACT_ID"]
TRADE_VERSION = ["TRADE_VERSION", "VERSION", "VERSION_NO", "VERSION_NUMBER", "TRADE_VERSION_NO", "ORIGINAL_TRADE_VERSION", "REVISION", "SEQ_NO"]
EVENT_TYPE = ["EVENT_TYPE", "EVENT_SUB_TYPE_ID", "EVENT", "ACTION_TYPE", "TRADE_ACTION", "LIFECYCLE_EVENT", "TRADE_EVENT"]
EVENT_TIME = ["EVENT_TIME", "TRADE_DATE_TIME", "EXECUTION_TIME", "EXEC_TIME", "TRADE_TIME", "EXECUTION_TIMESTAMP", "EVENT_TS"]
RECORD_TIME = ["RECORD_TIME", "CREATED_AT", "INSERT_TIME", "SYSTEM_TIME", "BOOKING_TIME", "ENTRY_TIME", "LOAD_TS", "CREATED_TS"]
BOOK = ["BOOK", "BOOK_ID", "BOOK_CODE", "BOOK_NAME", "PORTFOLIO"]
DESK = ["DESK", "DESK_ID", "DESK_CODE", "DESK_NAME", "BUSINESS_UNIT"]
INSTRUMENT_ID = ["INSTRUMENT_ID", "INSTRUMENT_IDENTIFIER", "ISIN", "SECURITY_ID", "CUSIP", "SEDOL", "TICKER", "RIC"]
PRODUCT_TYPE = ["PRODUCT_TYPE", "PRODUCT", "ASSET_CLASS", "INSTRUMENT_TYPE", "PRODUCT_CODE"]
SIDE = ["SIDE", "BUY_OR_SELL", "BUY_SELL", "BUYSELL", "DIRECTION", "BS_IND", "BS_FLAG"]
QUANTITY = ["QUANTITY", "QTY", "NOMINAL", "UNITS", "FACE_AMOUNT"]
PRICE = ["PRICE", "TRADE_PRICE", "EXEC_PRICE", "EXECUTION_PRICE", "DEAL_PRICE", "DEAL_RATE"]
CURRENCY = ["CURRENCY", "CCY", "TRADE_CCY", "CURRENCY_CODE", "TRADE_CURRENCY"]
NOTIONAL_USD = ["NOTIONAL_USD", "NET_CONSIDERATION_USD", "USD_NOTIONAL", "NOTIONAL_IN_USD", "CONSIDERATION_USD", "USD_AMOUNT"]
ORIGINAL_TRADE_ID = ["ORIGINAL_TRADE_ID", "ORIG_TRADE_ID", "PARENT_TRADE_ID", "REPLACES_TRADE_ID", "PREVIOUS_TRADE_ID"]
ALTERNATE_TRADE_ID = ["ALTERNATE_TRADE_ID", "ALT_TRADE_ID", "LEGACY_TRADE_ID", "EXTERNAL_TRADE_ID"]
URN_REF = ["URN_REF", "URN", "BLOCK_ID", "BLOCK_REF", "ALLOCATION_REF", "ALLOC_REF"]
SOURCE = ["SOURCE", "SOURCE_SYSTEM", "SRC_SYSTEM", "ORIGIN_SYSTEM", "SYSTEM"]
TRADER_ID = ["TRADER_ID", "TRADER", "TRADE_MODIFIER", "TRADER_CODE"]
ALERT_ID = ["ALERT_ID", "ALERTID", "ALERT_NUMBER", "ALERT_REF"]
RULE_ID = ["RULE_ID", "ALERT_TYPE_ID", "SCENARIO_ID", "RULE", "RULE_CODE"]
SUBRULE_ID = ["SUBRULE_ID", "MX_ALERT_TYPE", "SUB_RULE", "SUB_RULE_ID", "SCENARIO_VARIANT"]
ALERT_TIME = ["ALERT_TIME", "ALERT_DATE", "ALERT_TS", "GENERATED_AT", "ALERT_DATETIME"]
EXPLANATION_TEXT = ["EXPLANATION_TEXT", "REASON_COMMENT", "EXPLANATION", "NARRATIVE", "ALERT_COMMENT"]
RFI_ACTION = ["RFI_ACTION", "ACTION", "RFI_STATUS", "RFI_EVENT"]
OUTCOME_ID = ["OUTCOME_ID", "DISPOSITION_ID", "DECISION_ID"]
OUTCOME = ["OUTCOME", "DISPOSITION", "DECISION", "RESULT"]
LABEL_QUALITY = ["LABEL_QUALITY", "QA_STATUS", "LABEL_STATUS", "QUALITY"]
DECIDED_AT = ["DECIDED_AT", "DISPOSITION_TIME", "DECISION_TIME", "CLOSED_AT"]
DECIDED_BY = ["DECIDED_BY", "DISPOSITIONED_BY", "DECIDED_USER", "REVIEWER"]

[values.EVENT_TYPE]
NEW = ["N", "NEW", "NEW_TRADE", "BOOK", "BOOKED", "INSERT", "CREATE", "INS"]
AMEND = ["A", "AMD", "AMEND", "AMENDMENT", "MODIFY", "MOD", "UPDATE", "UPD", "CORRECT", "CORRECTION"]
CANCEL = ["C", "CXL", "CNL", "CANCEL", "CANCELLED", "CANCELED", "DELETE", "DEL", "VOID"]

[values.SIDE]
BUY = ["B", "BUY", "BOT", "BOUGHT", "LONG"]
SELL = ["S", "SELL", "SLD", "SOLD", "SHORT"]

[values.RFI_ACTION]
OPENED = ["OPEN", "OPENED", "RAISED", "SENT", "O"]
CLOSED = ["CLOSE", "CLOSED", "ANSWERED", "RESOLVED", "C"]

[values.OUTCOME]
CLEARED = ["CLEAR", "CLEARED", "CLOSED_NO_ACTION", "NO_ISSUE", "FALSE_POSITIVE", "FP", "DISMISSED"]
ESCALATED = ["ESCALATE", "ESCALATED", "TRUE_POSITIVE", "TP", "BREACH", "ISSUE"]

[values.LABEL_QUALITY]
RAW = ["RAW", "UNREVIEWED", "BULK", "AUTO"]
CURATED = ["CURATED", "QA", "QA_PASSED", "REVIEWED", "VALIDATED", "GOLD"]
