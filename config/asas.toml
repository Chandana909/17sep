# ASAS decision environment. Every threshold, tolerance, window, weight and limit lives here.
# Decimals are strings (no float drift). Bump `version` on any change: it is stamped on every
# run manifest, snapshot and policy decision. Missing decision keys fail safe.
version = "asas-config-2.1.0"

[pipeline]
review_window_days = 30          # cases are opened for alerts in this window; older data is history
max_workers = 1                  # parallel investigations (raise with an LLM; I/O bound)
max_staleness_hours = 96         # data gate: newest record older than this blocks bulk
volume_window_days = 7           # data gate: records in the last window ...
volume_baseline_windows = 4      # ... vs the median of this many previous windows
min_volume_ratio = "0.5"         # ... below this ratio blocks bulk (partial load)

[linking]
version = "linking-3"
max_span_hours = 336             # an episode never spans more than 14 days
medium_max_gap_hours = 24        # medium-tier keys only link trades booked within a day
max_key_fanout = 4               # a shared key linking more trades than this is a hub: demoted
degenerate_values = ["", "0", "NA", "N/A", "NULL", "NONE", "UNKNOWN", "-", "TBD"]
degenerate_patterns = ["0+", "9+"]
rebook_window_hours = 6          # residue: candidate rebook must follow the cancel within 6h
residue_max_candidates = 3

[signals]
period_end_cutoff_hours = "72"
round_trip_min_pct = "0.2"
round_trip_tolerance_pct = "0.05"
signature_max_tokens = 8
min_peer_n = 15
peer_levels = ["desk_product", "desk", "global"]
mad_scale = "1.4826"
meanad_scale = "1.253314"        # robust-z fallback when MAD is 0 (Iglewicz & Hoaglin)
baseline_lookback_days = 60
recurrence_window_days = 30

[data]
# Contract fields whose global coverage decides whether features that need them run at all.
measure_fields = ["SIDE", "QUANTITY", "PRICE", "NOTIONAL_USD"]
min_field_coverage = "0.5"       # below this share of non-null values the field is unavailable
unavailable_fields = []          # business override: fields known to be unreliable at source

[anomaly]
# Verified deviation analysis (docs/anomaly-analysis.md). Signals are behavioural; size is a
# severity amplifier (classification), not an anomaly on its own.
version = "anomaly-1"
signals = ["max_price_change_pct", "max_qty_change_pct", "n_amends", "booking_latency_hours_max",
           "rebook_price_change_pct", "hours_first_amend", "book_signature_recurrence"]
peer_levels = ["desk_product", "desk", "global"]
self_level = "book"              # the episode's own book history
screen_percentile = "95"
screen_robust_z = "3.5"
screen_mode = "all"              # all = percentile AND robust z must pass; any = either
min_confirming_levels = 2        # peer levels (with n >= signals.min_peer_n) that must agree
self_min_n = 8
stability_shift_days = 30        # re-test against the reference window shifted this far back
require_stability = false        # true: an untestable stability check blocks verification
z_cap = "10"                     # robust z at which a signal's strength saturates
joint_max_order = 3              # rare combinations of up to this many items
joint_min_reference = 200
joint_max_support = 0            # a combination seen at most this often in OTHER reference episodes
joint_min_item_support = 5       # ... while each of its items is individually common
joint_ignored_prefixes = ["desk="]
joint_ignored_items = ["flag:lifecycle_valid"]
band_high = "1.5"
band_medium = "0.75"
residual_escalation_band = "HIGH"  # unexplained deviation at or above this band -> escalation

[anomaly.tails]                  # upper | lower | both (default upper)
hours_first_amend = "upper"

[anomaly.quality_exclusions]     # a deviation on these signals is not trusted with these flags
max_price_change_pct = ["VERSION_GAP", "FIRST_EVENT_NOT_NEW", "EVENTS_AFTER_CANCEL"]
max_qty_change_pct = ["VERSION_GAP", "FIRST_EVENT_NOT_NEW", "EVENTS_AFTER_CANCEL"]
n_amends = ["VERSION_GAP", "EVENTS_AFTER_CANCEL"]
hours_first_amend = ["VERSION_GAP", "FIRST_EVENT_NOT_NEW"]
rebook_price_change_pct = ["DANGLING_ORIGINAL_TRADE_ID"]

[anomaly.weights]
peer_deviation = "1"
breadth = "0.25"
self_history = "0.25"
joint_rarity = "0.5"

[anomaly.explains]               # deviations a verified benign explanation accounts for
PRICE_CORRECTION = ["max_price_change_pct", "hours_first_amend", "n_amends", "joint"]
CANCEL_REBOOK_CORRECTION = ["rebook_price_change_pct", "book_signature_recurrence", "joint"]
ROUTINE_EXECUTION = ["joint"]
LATE_BOOKING_OPERATIONAL = ["booking_latency_hours_max", "joint"]

[classification]
confidence_high = 3              # independent lines of evidence for HIGH confidence
confidence_medium = 2
materiality_bump = true          # notional above scoring.materiality_usd raises severity a level
levels = ["LOW", "MEDIUM", "HIGH", "CRITICAL"]

[classification.severity]
PERIOD_END_ROUND_TRIP = "HIGH"
OFF_MARKET_AMENDMENT = "HIGH"
REBOOK_ECONOMICS_CHANGED = "HIGH"
VERIFIED_PEER_DEVIATION = "MEDIUM"
CANCEL_REBOOK_CORRECTION = "LOW"
PRICE_CORRECTION = "LOW"
LATE_BOOKING_OPERATIONAL = "MEDIUM"
ROUTINE_EXECUTION = "LOW"
UNRESOLVED = "MEDIUM"

[classification.typology_signals]  # signals whose verified deviation corroborates a typology
PERIOD_END_ROUND_TRIP = ["max_price_change_pct", "n_amends"]
OFF_MARKET_AMENDMENT = ["max_price_change_pct", "hours_first_amend"]
REBOOK_ECONOMICS_CHANGED = ["rebook_price_change_pct", "book_signature_recurrence"]

[scoring]
outlier_percentile = "95"
outlier_signals = ["max_price_change_pct", "rebook_price_change_pct", "booking_latency_hours_max",
                   "book_signature_recurrence", "notional_usd_max"]
rarity_min_pct = "97"
materiality_usd = "8000000"
override_materiality_usd = "15000000"
watchlist_books = []
band_high = "3.0"
band_elevated = "1.5"
unknown_rule_severity = "MEDIUM"
quality_flags_scored = ["FIRST_EVENT_NOT_NEW", "EVENTS_AFTER_CANCEL", "VERSION_GAP",
                        "LINK_REJECTED_OVER_SPAN", "LINK_REJECTED_CROSS_INSTRUMENT",
                        "HUB_DEMOTED_URN_REF", "HUB_DEMOTED_ALTERNATE_TRADE_ID",
                        "DANGLING_ORIGINAL_TRADE_ID", "DEGENERATE_ORIGINAL_TRADE_ID"]

[scoring.weights]
detections = "0.5"
outliers = "2"
rarity = "1"
materiality = "1"
data_quality = "0.5"
outlyingness = "0.5"             # verified deviation strength (anomaly.*), before explanation

[scoring.rule_severity]
R100 = "MEDIUM"
R200 = "LOW"
R300 = "MEDIUM"
R400 = "LOW"
R900 = "LOW"

[scoring.rule_severity_weights]
LOW = "0.5"
MEDIUM = "1"
HIGH = "2"

[rules]
max_conditions = 6

[tools]
max_items = 50
related_window_hours = 72
graph_max_depth = 2
graph_max_nodes = 60
similar_k = 5

[hypotheses]
routine_max_latency_hours = "1"
routine_allowed_outliers = ["notional_usd_max"]
price_correction_max_pct = "3.5"
correction_window_hours = "1"
rebook_qty_tolerance_pct = "0"
rebook_price_tolerance_pct = "0.5"
rebook_max_minutes = "120"
late_booking_hours = "4"
late_booking_missing_evidence = ["EXECUTION_TIMESTAMP_SOURCE_OF_RECORD", "SYSTEM_INCIDENT_REFERENCE"]
off_market_min_pct = "3.5"
off_market_percentile = "95"
off_market_robust_z = "3.5"
round_trip_min_pct = "0.2"
period_end_hours = "72"
churn_min_rebook_episodes = 2
context_min_cleared = 3
context_lookback_days = 90

[decisions]
blocking_degraded = ["NO_BASELINE"]
blocking_quality_flags = ["FIRST_EVENT_NOT_NEW", "EVENTS_AFTER_CANCEL", "VERSION_GAP",
                          "LINK_REJECTED_OVER_SPAN", "LINK_REJECTED_CROSS_INSTRUMENT",
                          "HUB_DEMOTED_URN_REF", "HUB_DEMOTED_ALTERNATE_TRADE_ID",
                          "DANGLING_ORIGINAL_TRADE_ID", "DEGENERATE_ORIGINAL_TRADE_ID"]
control_sample_rate = "0.05"     # share of would-be-bulk cases forced to individual review
control_sample_seed = "asas-control-1"
cohort_min_size = 2
cohort_max_size = 50

[challenger]
redundancy_min_alerts = 2
exposure_rules = ["R400"]
sampling_rules = ["R900"]
max_findings_per_run = 40         # redundancy / alternative-explanation / missing-context
max_blind_spots_per_run = 40      # blind spots are examined first, most outlying first

[discovery]
min_support = 8
max_itemset = 3
ignored_items = ["flag:lifecycle_valid"]
sample_size = 25
min_risk_rate = "0.8"
max_rule_coverage = "0.2"
min_escalated_labels = 3
min_curated_cleared = 10
min_benign_rate = "0.8"
max_patterns_per_kind = 3
candidate_severity = "MEDIUM"
max_volume_growth = "1.5"
min_candidate_precision = "0.8"
max_redundant_coverage = "0.8"   # skip a risk pattern an earlier proposal already covers

[discovery.bands]
max_price_change_pct = ["0.2", "1", "3.5"]
booking_latency_hours_max = ["1", "4"]
notional_usd_max = ["1000000", "5000000"]
max_qty_change_pct = ["1", "25", "100"]
n_amends = ["1", "2", "4"]

[replay]
evaluation_delay_hours = 24
window_days = 90
sample_size = 10

[counterexamples]
perturbation_pct = "1"
boundary_pct = "10"
max_listed = 15
min_labelled_per_half = 3
stability_tolerance = "0.3"
min_true_positives = 3
min_precision = "0.8"
max_false_positives = 2
min_target_recall = "0.7"
min_bulk_cleared = 10

[shadow]
window_days = 20
max_new_alerts_per_day = 15
min_assessed_precision = "0.6"

[governance]
four_eyes = true

[monitoring]                     # run-KPI drift vs the median of previous runs
history_runs = 20
min_history = 3
rate_tolerance = "0.15"          # absolute change in bulk / escalation / abstention / ... rates
volume_tolerance = "0.5"         # relative change in case and per-rule alert volumes

[observability]
metrics_enabled = true           # /metrics (aggregate counters only; restrict at the network)
ready_cache_seconds = 30         # readiness re-verifies the audit chain at most this often

[policy]
initial_bulk_scopes = [
  { hypothesis_type = "CANCEL_REBOOK_CORRECTION", desk = "*" },
  { hypothesis_type = "ROUTINE_EXECUTION", desk = "*" },
]

[security]
environment = "dev"              # dev | prod. prod refuses to start with insecure settings
mode = "dev"                     # dev (X-User headers, local only) | proxy | oidc (docs/security.md)
rate_limit_per_minute = 600      # per authenticated principal, per process
max_body_bytes = 1048576
person_data_groups = ["ASAS-PERSON-DATA"]

[security.role_map]              # directory group -> ASAS role (no mapped role = no access)
ASAS-VIEWERS = "viewer"
ASAS-ANALYSTS = "investigator"
ASAS-APPROVERS = "approver"
ASAS-ADMINS = "admin"

[security.desk_map]              # directory group -> desk entitlement ("*" = every desk)
ASAS-DESK-ALL = "*"
ASAS-DESK-EQ = "EQ"
ASAS-DESK-FX = "FX"
ASAS-DESK-RATES = "RATES"

[security.proxy]                 # identity forwarded by an authenticating reverse proxy
secret_env = "ASAS_PROXY_SECRET"
secret_header = "X-ASAS-Proxy-Secret"
user_header = "X-Forwarded-User"
groups_header = "X-Forwarded-Groups"

[security.oidc]                  # bearer JWTs from the identity provider, verified via JWKS
issuer = "https://login.example-bank.internal/realms/surveillance"
audience = "asas"
jwks_url = "https://login.example-bank.internal/realms/surveillance/protocol/openid-connect/certs"
algorithms = ["RS256"]
user_claim = "preferred_username"
groups_claim = "groups"
leeway_seconds = 30
token_header = "Authorization"

[audit]
anchor_dir = ""                  # external write-once location for signed chain heads ("" = off)
anchor_every_run = true          # anchor after every pipeline run when anchor_dir is set
signing = "ed25519"              # ed25519 (recommended: verifiers need only the public key) | hmac
key_env = "ASAS_AUDIT_SIGNING_KEY"        # PEM private key (ed25519) or secret (hmac)
public_key_env = "ASAS_AUDIT_PUBLIC_KEY"  # PEM public key for verification-only hosts

[storage]
auto_migrate = true              # dev. prod: false, and run `asas migrate` as the owner role
reader_url_env = "ASAS_DATABASE_READER_URL"  # optional SELECT-only role for readers

[agents]
enabled = false                  # true + a reachable endpoint = LLM policy; false = deterministic playbook
base_url = "http://localhost:11434/v1"   # Ollama / vLLM / LM Studio / DashScope (OpenAI-compatible)
model_id = "qwen2.5:7b-instruct"
api_key_env = "ASAS_LLM_API_KEY"
timeout_seconds = 60
retries = 2
backoff_seconds = "0.5"
breaker_threshold = 5
breaker_reset_seconds = 60
max_prompt_chars = 16000
max_output_tokens = 600
max_consecutive_rejections = 3   # then the playbook takes the step (a stuck model cannot burn budget)
suggest_next_action = true       # show the model the deterministic next-best action as advice
                                 # (small models follow it; the verifier still decides outcomes)
# Ordered fallback endpoints tried when the primary fails (then the deterministic playbook):
# fallbacks = [{ base_url = "http://gpu-2:8000/v1", model_id = "qwen2.5-14b-instruct", api_key_env = "" }]
fallbacks = []

[agents.budgets.investigator]
max_steps = 40
max_tool_calls = 24
max_model_calls = 30
max_seconds = 120

[agents.budgets.challenger]
max_steps = 400
max_tool_calls = 300
max_model_calls = 60
max_seconds = 300

[agents.budgets.discovery]
max_steps = 40
max_tool_calls = 20
max_model_calls = 20
max_seconds = 300
